[project]
name = "memory-hole-simulator"
version = "0.1.0"
description = "3D memory-hole transport and charging research simulator"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "pydantic>=2.10,<3",
  "h5py>=3.12,<4",
  "gmsh>=4.13,<5",
  "numba>=0.61,<1",
  "python-multipart>=0.0.32",
  "pyamg>=5.3.0",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda13x[ctk]>=14.2,<15",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_hole"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI's File/Form declarations are intentional route metadata.
